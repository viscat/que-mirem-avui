<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palomitas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .popcorn {
            margin: 10px;
            text-align: center;
        }
        .popcorn img {
            width: 90px;
            height: auto;
        }
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .container {
                page-break-inside: avoid;
            }
            .back-to-index {
                display: none;
            }
        }
        .page-break {
            page-break-before: always;
            break-before: page;
        }

        .back-to-index {
            background-color: #333;
            color: white;
            padding: 3rem 0;
            text-align: center;
            margin-bottom: 10px;
        }
        .back-to-index .link {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s;
        }
        .back-to-index .link:hover {
            color: #007BFF;
        }
        
    </style>
</head>
<body>
    <header class="back-to-index">
        <a href="index.html" class="link">⬅️ Volver al inicio</a>
    </header>
    <div id="popcorn-container" class="container"></div>
    <div class="page-break"></div>
    <div id="popcorn-container-flipped" class="container"></div>

    <script>
        // Function to generate popcorn
        function generatePopcorn(containerId, count, flipped = false) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < count; i++) {
                const popcornDiv = document.createElement('div');
                popcornDiv.className = 'popcorn';
                if (flipped) {
                    popcornDiv.style.transform = 'scaleX(-1)';
                }
                const img = document.createElement('img');
                img.src = 'popcorn.png';
                img.alt = 'Palomita';
                popcornDiv.appendChild(img);
                container.appendChild(popcornDiv);
            }
        }

        // Generate normal popcorn
        generatePopcorn('popcorn-container', 48);

        // Generate flipped popcorn
        generatePopcorn('popcorn-container-flipped', 48, true);
    </script>
</body>
</html>
