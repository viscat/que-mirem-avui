<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Tokens de Puntuació (+)</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      flex-wrap: wrap;
      background: white;
    }

    .token {
      width: 100px;
      height: 100px;
      background-image: url('crispetes-plenes.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      position: relative;
    }

    .token span {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2em;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 600;
      color: green;
      text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white,
        -1px  0px 0 white,
         1px  0px 0 white,
         0px  1px 0 white,
         0px -1px 0 white;
    }

    .token.neg span{
      color: darkred;
    }

    .token.neg {
      background-image: url('crispetes-buides.png');
    }

    @media print {
      body {
        gap: 0.5cm;
        padding: 1cm;
        background: white;
      }
    }
    .page-break {
      page-break-before: always;
      break-before: page;
    }
  </style>
</head>
<body>
  <div class="token"><span>+1</span></div>
  <div class="token"><span>+2</span></div>
  <div class="token"><span>+3</span></div>
  <div class="token neg"><span>-1</span></div>
  <div class="token neg"><span>-2</span></div>
  <div class="token neg"><span>-3</span></div>

  <div class="token"><span>+1</span></div>
  <div class="token"><span>+2</span></div>
  <div class="token"><span>+3</span></div>
  <div class="token neg"><span>-1</span></div>
  <div class="token neg"><span>-2</span></div>
  <div class="token neg"><span>-3</span></div>

  <div class="token"><span>+1</span></div>
  <div class="token"><span>+2</span></div>
  <div class="token"><span>+3</span></div>
  <div class="token neg"><span>-1</span></div>
  <div class="token neg"><span>-2</span></div>
  <div class="token neg"><span>-3</span></div>

  <div class="token"><span>+1</span></div>
  <div class="token"><span>+2</span></div>
  <div class="token"><span>+3</span></div>
  <div class="token neg"><span>-1</span></div>
  <div class="token neg"><span>-2</span></div>
  <div class="token neg"><span>-3</span></div>

 
  

</body>
</html>
